services:
  postgres:
    image: postgres:16-alpine
    container_name: ordering-postgres
    environment:
      POSTGRES_USER: ordering
      POSTGRES_PASSWORD: ordering
      POSTGRES_DB: ordering
    ports:
      # 5441 on the host: 5432 is commonly taken by other local projects.
      - "5441:5432"
    volumes:
      - ordering-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordering -d ordering"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ordering-pgdata:
